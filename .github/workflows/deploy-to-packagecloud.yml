name: Build and Deploy to Packagecloud
on:
  # Allow manual runs of workflow from Actions tab
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'debian/changelog'
permissions:
  contents: read
  actions: read

jobs:
  check_version:
    name: Check py & deb pkg versions match
    uses: WLAN-Pi/gh-workflows/.github/workflows/check-py-deb-pkg-versions-match.yml@main
    with:
      python_version_file_path: 'profiler/__version__.py'
  format:
    name: Get formatted version for filename
    uses: WLAN-Pi/gh-workflows/.github/workflows/get-formatted-version-string.yml@main
  sbuild_deploy:
    name: sbuild deploy pkg
    needs: 
      - format
      - check_version
    uses: WLAN-Pi/gh-workflows/.github/workflows/sbuild-deploy-pkg.yml@main
    with:
      pkg: wlanpi-profiler
      version: ${{ needs.format.outputs.version }}
      distros: '["trixie"]'
    secrets: inherit
  tag:
    name: Tag the release
    needs: sbuild_deploy
    permissions:
      contents: write
    uses: WLAN-Pi/gh-workflows/.github/workflows/tag-release.yml@main
  discord-workflow-status:
    if: ${{ always() && github.repository_owner == 'WLAN-Pi' && ! github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    name: Post Workflow Status to Discord
    needs:
      - sbuild_deploy
    uses: WLAN-Pi/gh-workflows/.github/workflows/discord-workflow-status.yml@main
    permissions:
      actions: read
      contents: read
    with:
      parent_run_id: ${{ github.run_id }}
    secrets: inherit
