[tox]
skip_missing_interpreters = true
envlist = py313
requires = setuptools >= 68.0.0
           pip >= 23.0
           virtualenv >= 20.25.0

[testenv]
description = run the test driver
allowlist_externals =
    python
    coverage
    coverage-badge
deps =
    coverage
    mock
    pytest
    manuf2
    setuptools<82
commands =
    coverage run --source profiler -m pytest -vv --capture=sys -m "not ondevice" {posargs}
    coverage report --show-missing
    coverage xml
    coverage-badge -f -o coverage.svg

[testenv:formatcheck]
description = run the format check toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format --check profiler tests

[testenv:format]
description = run the format toolchain
basepython = python3
skip_install = true
deps =
    ruff
commands =
    ruff format profiler tests

[testenv:lint]
# Installs the package so mypy can resolve the runtime deps it imports
# (scapy, jinja2, manuf2); without them every import is import-not-found.
description = run the linting toolchain
deps =
    ruff
    mypy>=1.14.1
commands =
    ruff check profiler tests
    mypy profiler
